<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b4965" />
    <title>HowFar</title>
    <style>
    :root {
      color: #f7fbff;
      background: #102a43;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
    }

    main {
      box-sizing: border-box;
      display: grid;
      gap: 1.5rem;
      margin: 0 auto;
      max-width: 38rem;
      min-height: 100dvh;
      padding: 1.5rem;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    header,
    .point-card,
    .result-card {
      display: grid;
      gap: 0.75rem;
    }

    .point-card,
    .result-card {
      background: #243b53;
      border-radius: 0.75rem;
      padding: 1.25rem;
    }

    button {
      background: #f6c453;
      border: 0;
      border-radius: 0.5rem;
      color: #102a43;
      font: inherit;
      font-weight: 700;
      min-height: 3.5rem;
      padding: 0.75rem 1rem;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    button:focus-visible {
      outline: 0.2rem solid #fff;
      outline-offset: 0.2rem;
    }

    .primary-distance {
      font-size: clamp(3rem, 15vw, 5rem);
      font-weight: 800;
      line-height: 1;
    }

    .secondary-distance {
      font-size: 1.25rem;
    }

    [role='alert'] {
      color: #ffb3ba;
    }

    .muted {
      color: #bcccdc;
    }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>HowFar</h1>
        <p class="muted">Measure the straight-line distance from Start to End.</p>
      </header>
      <section class="point-card" aria-labelledby="start-heading">
        <h2 id="start-heading">Start</h2>
        <p id="start-status" class="muted">Capture your starting point.</p>
        <button id="capture-start" type="button">Capture Start</button>
      </section>
      <section class="point-card" aria-labelledby="end-heading">
        <h2 id="end-heading">End</h2>
        <p id="end-status" class="muted">Capture Start before capturing End.</p>
        <button id="capture-end" type="button" disabled>Capture End</button>
      </section>
      <section id="result" class="result-card" hidden aria-live="polite">
        <h2>Distance</h2>
        <p id="imperial-distance" class="primary-distance"></p>
        <p id="metric-distance" class="secondary-distance"></p>
        <p id="novelty-distance" class="secondary-distance"></p>
        <button id="new-measurement" type="button">Start New Measurement</button>
      </section>
      <p id="status" role="alert" hidden></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
